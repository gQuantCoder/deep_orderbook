[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "deep-orderbook"
version = "0.5.299792458"
description = "Deep order book processing, feeds, and learning utilities"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "gQuantCoder" }]
dependencies = [
    "aiofiles>=23",
    "anywidget>=0.9",
    "coinbase-advanced-py>=1.8",
    "ipython>=8",
    "ipywidgets>=8",
    "nbformat>=4.2",
    "numpy>=1.26",
    "plotly>=5.18",
    "polars>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "rich>=13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
learn = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyinstrument>=5", "ruff>=0.8"]

[project.scripts]
deepbook = "deep_orderbook.__main__:main"

[tool.black]
line-length = 88
skip-string-normalization = true
target_version = ["py312"]
exclude = '''
/(
  | migrations
)/
'''

[tool.isort]
line_length = 88
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
extend_skip_glob = ["*/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.mccabe]
max-complexity = 10

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

