[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-orderbook"
version = "0.5.299792458"
description = "Deep order book processing, feeds, and learning utilities"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "gQuantCoder" }]
dependencies = [
    "aiofiles>=23",
    "anywidget>=0.9",
    "coinbase-advanced-py>=1.8",
    "ipython>=8",
    "ipywidgets>=8",
    "nbformat>=4.2",
    "numpy>=1.26",
    "plotly>=5.18",
    "matplotlib>=3.10",
    "polars>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "rich>=13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
learn = ["torch>=2.2"]

[project.scripts]
deepbook = "deep_orderbook.__main__:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyinstrument>=5",
    "ruff>=0.8",
    "ty>=0.0.31",
]

[tool.setuptools]
package-dir = { "" = "." }
packages = ["deep_orderbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests that take a long time to run",
    "live: marks tests that require a live exchange connection",
]
filterwarnings = [
    "ignore::PendingDeprecationWarning",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
xfail_strict = true

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["deep_orderbook"]

[tool.pyright]
include = ["deep_orderbook", "scripts", "tests"]
exclude = [".venv", "**/__pycache__", "**/node_modules", "**/.git", "**/dist", "**/build"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.12"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

