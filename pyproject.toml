[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-orderbook"
dynamic = ["version"]
description = "Advanced cryptocurrency order book analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "gQuantCoder" }]
dependencies = [
    "coinbase-advanced-py==1.4.3",
    "websockets==12.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "tqdm>=4.66",
    "aioitertools>=0.11",
    "aiofiles>=24.1",
    "seaborn>=0.13",
    "seaborn-image>=0.10",
    "plotly>=5.24",
    "panel>=1.5",
    "numpy<2",
    "polars>=1.4",
    "pandas>=2.2",
    "holoviews>=1.19",
    "bokeh>=3.6",
    "jupyter-bokeh>=4.0",
    "rich>=14",
]

[project.optional-dependencies]
train = ["torch>=2.4"]

[project.scripts]
deepbook = "deep_orderbook.__main__:main"
deepbook-record = "deep_orderbook.consumers.recorder:main"
deepbook-replay = "deep_orderbook.replayer:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24.8",
    "isort>=5.13",
    "mypy>=1.11",
]

[tool.setuptools]
packages = { find = { include = ["deep_orderbook*"] } }

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.uv]
package = true
default-groups = ["dev"]

[tool.black]
line-length = 88
skip-string-normalization = true
target_version = ['py312']
exclude = '''
/(
  | migrations
)/
'''

[tool.isort]
line_length = 88
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
extend_skip_glob = ["*/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.mccabe]
max-complexity = 10
